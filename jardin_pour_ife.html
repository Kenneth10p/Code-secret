<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pour toi 🌸</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: Georgia, 'Times New Roman', serif; background: #fce8f3; overflow: hidden; }
#gw { width: 100%; height: 100vh; min-height: 520px; position: relative; overflow: hidden; background: #fce8f3; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#sky-bg { position: absolute; top: 0; left: 0; width: 100%; height: 68%; background: linear-gradient(180deg,#b8e4f9 0%,#fce8f3 100%); }
#sun { position: absolute; top: 26px; right: 56px; width: 54px; height: 54px; border-radius: 50%; background: #ffe066; box-shadow: 0 0 0 10px #fff5b0; }
.cloud { position: absolute; }
#ground-back { position: absolute; bottom: 0; left: 0; width: 100%; height: 130px; background: #b8e07a; border-radius: 60% 60% 0 0/30px 30px 0 0; }
#ground-line { position: absolute; bottom: 82px; left: 0; width: 100%; height: 6px; background: #6db82a; border-radius: 3px; }
#ground-front { position: absolute; bottom: 0; left: 0; width: 100%; height: 84px; background: #8ecf3a; }
#flower-area { position: absolute; bottom: 76px; left: 0; width: 100%; display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; gap: 8px; padding: 0 14px; min-height: 140px; }
.flower-item { display: flex; flex-direction: column; align-items: center; position: relative; }
.stem { width: 3px; border-radius: 2px; background: #4a9e2a; transform-origin: bottom; transition: height 0.15s linear; }
.bloom { transition: transform 0.5s cubic-bezier(.34,1.56,.64,1), opacity 0.4s; transform: scale(0); opacity: 0; margin-bottom: -2px; }
.bloom.open { transform: scale(1); opacity: 1; }
.leaf-l,.leaf-r { position: absolute; width: 13px; height: 7px; border-radius: 50% 50% 50% 0; background: #5ab82e; opacity: 0; transition: opacity 0.4s; }
.leaf-l { left: -11px; top: 35%; transform: rotate(-40deg); }
.leaf-r { right: -11px; top: 55%; transform: rotate(140deg); }
.leaf-l.show,.leaf-r.show { opacity: 1; }
#controls { position: absolute; bottom: 16px; left: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; z-index: 6; }
#water-btn { background: #fff; border: 1.5px solid #6bbce0; border-radius: 30px; padding: 11px 26px; font-family: Georgia, serif; font-size: 14px; font-style: italic; color: #2a7ba0; cursor: pointer; box-shadow: 0 2px 8px rgba(80,150,200,.12); transition: transform .1s, background .2s; }
#water-btn:active { transform: scale(.96); background: #eaf6fc; }
#counter-lbl { font-size: 12px; color: #a07060; font-style: italic; min-width: 54px; text-align: center; }
.droplet { position: absolute; width: 5px; height: 8px; background: #7ec8ec; border-radius: 50% 50% 50% 50%/60% 60% 40% 40%; opacity: .85; pointer-events: none; z-index: 5; }
.butterfly { position: absolute; cursor: pointer; z-index: 7; transition: transform .15s; }
.butterfly:active { transform: scale(.85); }
#bf-hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,250,255,.95); border: 1px solid #d8b4e8; border-radius: 20px; padding: 7px 18px; font-size: 13px; color: #8a4aa0; font-style: italic; z-index: 8; opacity: 0; transition: opacity .5s; pointer-events: none; white-space: nowrap; }
#bf-hint.show { opacity: 1; }
#overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; pointer-events: none; padding: 1rem; }
.card { background: rgba(255,245,250,.97); border: 1px solid #f0b8d0; border-radius: 18px; padding: 1.6rem 1.9rem; max-width: 300px; text-align: center; opacity: 0; transform: translateY(12px) scale(.94); transition: opacity .4s, transform .4s; pointer-events: none; box-shadow: 0 4px 24px rgba(196,83,126,.12); }
.card.show { opacity: 1; transform: none; pointer-events: all; }
.card p { font-size: 15px; line-height: 1.85; color: #7a2040; font-style: italic; }
.card.special { border-color: #e0b84c; background: rgba(255,250,238,.98); }
.card.special p { color: #8a6010; }
.card.bonus { border-color: #c8a0e0; background: rgba(250,245,255,.98); }
.card.bonus p { color: #6a3a90; }
.card button { margin-top: 1.1rem; background: none; border: 1px solid currentColor; border-radius: 20px; padding: 6px 20px; font-family: Georgia, serif; font-size: 12px; cursor: pointer; color: inherit; }
#welcome { position: absolute; inset: 0; background: linear-gradient(180deg,#cdeafa 0%,#fce8f3 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; text-align: center; padding: 2rem; transition: opacity .8s; }
#welcome h2 { font-weight: 400; font-size: 23px; color: #c4537e; margin-bottom: 1rem; font-style: italic; }
#welcome p { font-size: 15px; color: #8a4060; line-height: 1.75; max-width: 300px; margin-bottom: 1.9rem; font-style: italic; }
#enter-btn { background: #fff; border: 1.5px solid #e083b0; border-radius: 30px; padding: 12px 32px; font-family: Georgia, serif; font-size: 15px; font-style: italic; color: #c4537e; cursor: pointer; box-shadow: 0 3px 12px rgba(196,83,126,.15); transition: transform .15s, background .2s; }
#enter-btn:active { transform: scale(.97); background: #fdf0f5; }
#hint { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #b07a90; font-style: italic; z-index: 6; transition: opacity .6s; }
</style>
</head>
<body>
<div id="gw">
  <div id="sky-bg"></div>
  <div id="sun"></div>
  <svg class="cloud" style="top:36px;left:50px" width="86" height="34" viewBox="0 0 86 34"><ellipse cx="43" cy="25" rx="40" ry="11" fill="#fff" opacity=".9"/><ellipse cx="29" cy="19" rx="19" ry="15" fill="#fff" opacity=".9"/><ellipse cx="53" cy="17" rx="22" ry="17" fill="#fff" opacity=".9"/></svg>
  <svg class="cloud" style="top:22px;left:210px" width="66" height="26" viewBox="0 0 66 26"><ellipse cx="33" cy="19" rx="30" ry="9" fill="#fff" opacity=".82"/><ellipse cx="23" cy="14" rx="15" ry="12" fill="#fff" opacity=".82"/><ellipse cx="42" cy="12" rx="17" ry="13" fill="#fff" opacity=".82"/></svg>

  <div id="ground-back"></div>
  <div id="ground-line"></div>
  <div id="ground-front"></div>

  <div id="hint">tiens le bouton pour arroser 💧</div>
  <div id="bf-hint">vite, attrape le papillon ! 🦋</div>
  <div id="flower-area"></div>

  <div id="controls">
    <span id="counter-lbl"></span>
    <button id="water-btn">💧 arroser</button>
  </div>

  <div id="overlay">
    <div class="card" id="msg-card"><p id="msg-text"></p><button id="msg-close">fermer</button></div>
  </div>

  <div id="welcome">
    <h2>Pour toi 🌸</h2>
    <p>Quelqu'un t'a préparé un jardin vide... à toi de le faire fleurir. Arrose, et regarde ce qui pousse.</p>
    <button id="enter-btn">entrer dans le jardin</button>
  </div>
</div>

<script>
const messages = [
  "Je suis là. Pas besoin de tout expliquer — juste savoir que tu peux compter sur moi.",
  "Tu n'as pas à traverser ça seule. Je suis là, même en silence.",
  "Tu es plus forte que tu ne le crois. Et même quand tu ne l'es pas, c'est bien aussi.",
  "T'as le droit de souffler aujourd'hui. T'as le droit de ne rien devoir à personne.",
  "Peu importe ce qu'il se passe, je serai là. C'est pas une promesse en l'air — c'est juste vrai.",
  "Tu es vue. Tu es aimée. Même les jours où tu l'oublies.",
  "Si jamais tu veux parler, je suis là. Et si tu veux juste du silence, je suis là aussi.",
  "Tu mérites tout le doux que la vie a à offrir.",
  "Je ne sais pas ce que tu traverses, mais je sais que tu vas t'en sortir. Et je serai là pendant.",
  "Tu n'as pas besoin d'aller bien pour être aimée. Tu l'es, comme tu es, maintenant."
];
const bonusMsgs = [
  "Petit rappel : tu es magnifique aujourd'hui.",
  "Coucou toi. J'ai pensé à toi, juste comme ça.",
  "Tu es la plus jolie chose de ma journée.",
  "Un sourire pour toi, où que tu sois maintenant."
];
const specialMsg = "Si tu es arrivée jusqu'ici, c'est que tu as pris un moment pour toi. Et ça me rend heureux. Dans les bons jours comme dans les durs, je suis là. Tu n'es jamais seule. — pour toi 💛";

const petalColors = [['#f9a8d4','#fdf2f8'],['#f0abfc','#faf5ff'],['#c4b5fd','#f5f3ff'],['#fb7185','#fff1f2'],['#fda4af','#fff1f2'],['#e879f9','#fdf4ff'],['#f472b6','#fdf2f8'],['#a78bfa','#f5f3ff'],['#f9c8d9','#fff0f6'],['#d946ef','#fdf4ff']];
const leafColors = ['#5ab82e','#4a9e2a','#56b030','#3d8e1e'];

const gw=document.getElementById('gw'), flowerArea=document.getElementById('flower-area'), waterBtn=document.getElementById('water-btn'), counterLbl=document.getElementById('counter-lbl'), msgCard=document.getElementById('msg-card'), msgText=document.getElementById('msg-text'), msgClose=document.getElementById('msg-close'), welcome=document.getElementById('welcome'), enterBtn=document.getElementById('enter-btn'), hint=document.getElementById('hint'), bfHint=document.getElementById('bf-hint');

let count=0, specialShown=false, bfHintShown=false, entered=false;
let pool=shuffle([...messages]), pIdx=0;
let active=null, growTimer=null, dropTimer=null;
const TARGET=()=>38+Math.random()*34;

function shuffle(a){return a.sort(()=>Math.random()-.5);}
function nextMsg(){ if(pIdx>=pool.length){pool=shuffle([...messages]);pIdx=0;} return pool[pIdx++]; }
function makeSVG(p,c){let e='';[0,45,90,135,180,225,270,315].forEach(a=>{e+=`<ellipse cx="18" cy="18" rx="5" ry="9" fill="${p}" opacity=".92" transform="rotate(${a} 18 18) translate(0,-7)"/>`;});return `<svg width="36" height="36" viewBox="0 0 36 36">${e}<circle cx="18" cy="18" r="6" fill="${c}"/><circle cx="18" cy="18" r="3" fill="#fde0ec"/></svg>`;}

function newSprout(){
  const i=count;
  const ci=i%petalColors.length, lc=leafColors[i%leafColors.length];
  const item=document.createElement('div');
  item.className='flower-item';
  item.innerHTML=`<div class="bloom" id="b${i}"></div><div class="leaf-l" id="ll${i}"></div><div class="leaf-r" id="lr${i}"></div><div class="stem" id="st${i}" style="height:0px"></div>`;
  flowerArea.appendChild(item);
  active={i, h:0, target:TARGET(), pc:petalColors[ci][0], cc:petalColors[ci][1], lc, item};
}
function startWater(e){
  if(e&&e.cancelable)e.preventDefault();
  if(!active) newSprout();
  if(!growTimer){
    growTimer=setInterval(()=>{
      if(!active)return;
      active.h+=2.2;
      const st=document.getElementById('st'+active.i);
      if(st)st.style.height=Math.min(active.h,active.target)+'px';
      if(active.h>=active.target) finishFlower();
    },40);
  }
  if(!dropTimer){ dropTimer=setInterval(spawnDrop,120); }
}
function stopWater(e){
  if(e&&e.cancelable)e.preventDefault();
  clearInterval(growTimer);growTimer=null;
  clearInterval(dropTimer);dropTimer=null;
}
function spawnDrop(){
  if(!active)return;
  const rect=active.item.getBoundingClientRect();
  const gwRect=gw.getBoundingClientRect();
  const x=rect.left-gwRect.left+rect.width/2-2+(Math.random()*16-8);
  const d=document.createElement('div');
  d.className='droplet';
  d.style.left=x+'px';
  d.style.top=(gwRect.height-190)+'px';
  gw.appendChild(d);
  const fall=110+Math.random()*30;
  d.animate([{transform:'translateY(0)',opacity:.85},{transform:`translateY(${fall}px)`,opacity:0}],{duration:600,easing:'ease-in'});
  setTimeout(()=>d.remove(),600);
}
function finishFlower(){
  clearInterval(growTimer);growTimer=null;
  clearInterval(dropTimer);dropTimer=null;
  const a=active; active=null;
  const bl=document.getElementById('b'+a.i);
  bl.innerHTML=makeSVG(a.pc,a.cc);
  bl.classList.add('open');
  const ll=document.getElementById('ll'+a.i), lr=document.getElementById('lr'+a.i);
  ll.style.background=a.lc; lr.style.background=a.lc;
  ll.classList.add('show'); lr.classList.add('show');
  count++;
  counterLbl.textContent=count===1?'1 fleur':count+' fleurs';
  hint.style.opacity='0';
  setTimeout(()=>{
    if(count===5 && !specialShown){ specialShown=true; showCard(specialMsg,'special'); }
    else showCard(nextMsg(),'');
  },450);
}
function showCard(txt,cls){ msgCard.className='card show'+(cls?' '+cls:''); msgText.textContent=txt; }
msgClose.addEventListener('click',()=>msgCard.classList.remove('show'));

waterBtn.addEventListener('pointerdown',startWater);
waterBtn.addEventListener('pointerup',stopWater);
waterBtn.addEventListener('pointerleave',stopWater);
waterBtn.addEventListener('pointercancel',stopWater);

enterBtn.addEventListener('click',()=>{ entered=true; welcome.style.opacity='0'; setTimeout(()=>welcome.style.display='none',800); });

function launchButterfly(){
  const b=document.createElement('div');
  b.className='butterfly';
  const fromLeft=Math.random()>.5;
  const colors=['#f472b6','#a78bfa','#fbbf24','#f9a8d4'];
  const col=colors[Math.floor(Math.random()*colors.length)];
  b.innerHTML=`<svg width="32" height="28" viewBox="0 0 30 26"><g><ellipse cx="9" cy="9" rx="7" ry="8" fill="${col}" opacity=".9"/><ellipse cx="21" cy="9" rx="7" ry="8" fill="${col}" opacity=".9"/><ellipse cx="10" cy="18" rx="5" ry="6" fill="${col}" opacity=".75"/><ellipse cx="20" cy="18" rx="5" ry="6" fill="${col}" opacity=".75"/><rect x="14" y="6" width="2" height="16" rx="1" fill="#5a3a2a"/></g></svg>`;
  const topY=50+Math.random()*120;
  b.style.top=topY+'px';
  b.style.left=fromLeft?'-40px':'calc(100% + 40px)';
  gw.appendChild(b);

  if(!bfHintShown){
    bfHintShown=true;
    bfHint.classList.add('show');
    setTimeout(()=>bfHint.classList.remove('show'),5000);
  }

  const wings=b.querySelector('g');
  const flap=wings.animate([{transform:'scaleX(1)'},{transform:'scaleX(.6)'}],{duration:180,direction:'alternate',iterations:Infinity});
  const w=gw.getBoundingClientRect().width;
  const endX=fromLeft?w+80:-(w+80);
  const anim=b.animate([{transform:'translate(0,0)'},{transform:`translate(${endX}px, ${Math.random()*40-20}px)`}],{duration:9000,easing:'ease-in-out'});
  let caught=false;
  b.addEventListener('pointerdown',()=>{
    if(caught)return; caught=true;
    anim.cancel(); flap.cancel();
    showCard(bonusMsgs[Math.floor(Math.random()*bonusMsgs.length)],'bonus');
    b.animate([{opacity:1},{opacity:0,transform:'translateY(-20px) scale(.5)'}],{duration:500}).onfinish=()=>b.remove();
  });
  anim.onfinish=()=>{ if(!caught)b.remove(); };
}
setInterval(()=>{ if(entered&&Math.random()>.3) launchButterfly(); }, 14000);
setTimeout(()=>{ if(entered) launchButterfly(); }, 6000);
</script>
</body>
</html>
